name: Code Analysis
on: push

jobs:
  Lint:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        NODE_ENV: development
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: "npm ci"
      - name: Run ESLint
        run: "npm run lint"
  Unit-Test:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: "npm ci"
      - name: Run Unit Tests
        run: "npm run test:ci"
  SonarScan:
    runs-on: ubuntu-latest
    needs: 
      - Unit-Test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info