name: Code Analysis
on: push

jobs:
  Lint:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        NODE_ENV: development
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: "npm ci"
      - name: Run ESLint
        run: "npm run lint"
  Unit-Test:
    runs-on: ubuntu-latest
    container:
      image: node:24
      env:
        NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: "npm ci"
      - name: Run Unit Tests
        run: "npm run test:ci"
  SonarScan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}